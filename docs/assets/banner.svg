<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Beyond Style UAE Order Control Console</title>
  <desc id="d">A human-approved sales operating console: the agent drafts, the owner approves, the system tracks.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6864B"/>
      <stop offset="0.55" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#E4CFA1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="#0A0A0A"/>
  <g fill="none" stroke="#C9A96E" stroke-opacity="0.18">
    <circle cx="1120" cy="200" r="90"/><circle cx="1120" cy="200" r="140"/><circle cx="1120" cy="200" r="190"/><circle cx="1120" cy="200" r="240"/>
  </g>
  <!-- Brand mark (from public/icon.svg) -->
  <g transform="translate(96 72) scale(0.75)">
    <rect width="128" height="128" rx="28" fill="#151515" stroke="#C9A96E" stroke-opacity="0.4"/>
    <path d="M40 30h30c11 0 20 8 20 18 0 6-3 11-8 14 6 3 10 9 10 16 0 12-10 20-22 20H40V30zm10 10v20h18c6 0 10-4 10-10s-4-10-10-10H50zm0 30v28h20c7 0 12-6 12-14s-5-14-12-14H50z" fill="url(#gold)"/>
    <circle cx="98" cy="98" r="6" fill="#E4CFA1"/>
  </g>
  <text x="96" y="248" font-family="Cormorant Garamond, Georgia, serif" font-size="64" font-weight="600" fill="#F5F1E8">Beyond Style <tspan fill="#C9A96E">UAE</tspan></text>
  <text x="96" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#E4CFA1">Order Control Console</text>
  <text x="96" y="336" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#bdb6a8">The agent drafts · the owner approves · the system tracks</text>
  <!-- Flow steps -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="760" y="92" width="220" height="52" rx="26" fill="#151515" stroke="#C9A96E" stroke-opacity="0.5"/>
    <text x="870" y="124" text-anchor="middle" fill="#F5F1E8">Draft reply</text>
    <rect x="760" y="174" width="220" height="52" rx="26" fill="#151515" stroke="#C9A96E" stroke-opacity="0.5"/>
    <text x="870" y="206" text-anchor="middle" fill="#F5F1E8">Guardrail checks</text>
    <rect x="760" y="256" width="220" height="52" rx="26" fill="url(#gold)"/>
    <text x="870" y="288" text-anchor="middle" fill="#0A0A0A">Owner approval</text>
    <path d="M870 144 V174 M870 226 V256" stroke="#C9A96E" stroke-width="2"/>
  </g>
  <text x="1184" y="360" direction="rtl" text-anchor="start" font-family="Noto Sans Arabic, Segoe UI, Tahoma, sans-serif" font-size="22" fill="#E4CFA1">لوحة التحكم بالطلبات</text>
</svg>
